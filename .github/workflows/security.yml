name: Security Pipeline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Bước 1: Quét SAST toàn bộ code, xuất báo cáo SARIF
      - name: Semgrep scan
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep semgrep \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --metrics=off \
            --sarif --output /src/semgrep.sarif \
            /src

      # Bước 2: Đưa kết quả lên tab Security của GitHub
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

      # Bước 3: SECURITY GATE — lỗi mức ERROR thì FAIL pipeline
      - name: Security gate (fail on ERROR findings)
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep semgrep \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --metrics=off \
            --severity ERROR --error \
            /src

  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # "Deploy" app mục tiêu (thực tế là deploy lên staging)
      - name: Deploy target app
        run: |
          docker network create scan-net
          docker run -d --name juice-shop -p 3000:3000 --network scan-net bkimminich/juice-shop
          for i in $(seq 1 30); do curl -sf http://localhost:3000 >/dev/null 2>&1 && break; sleep 2; done

      # Quét DAST baseline (passive) — spider + passive scan, không phá app
      - name: ZAP baseline scan
        run: |
          mkdir -p reports
          chmod 777 reports   # container ZAP (user zap) phải ghi được vào đây
          docker run --rm --network scan-net \
            -v "$PWD/reports:/zap/wrk:rw" zaproxy/zap-stable \
            zap-baseline.py -t http://juice-shop:3000 \
            -J zap-dast.json -r zap-dast.html -m 5 -I

      # SECURITY GATE: FAIL nếu có cảnh báo mức High
      - name: DAST gate (fail on High)
        run: python3 scripts/check_dast.py reports/zap-dast.json

      - name: Upload DAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-report
          path: reports/

  secrets:
    name: Secret Scan - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gate: phát hiện BẤT KỲ bí mật nào (key, password, token) là FAIL
      - name: Gitleaks scan
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --no-git --source /repo \
            --report-format json --report-path /repo/reports/gitleaks.json -v

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: reports/gitleaks.json

  sca:
    name: SCA - Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gate: dependency có CVE mức CRITICAL là FAIL
      - name: Trivy dependency scan (gate on CRITICAL)
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest \
            fs --scanners vuln --severity CRITICAL --exit-code 1 /src

      # Image scan: chỉ báo cáo (demo image cố ý nhiều CVE), không chặn
      - name: Trivy image scan (report only)
        if: always()
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD/reports:/out" aquasec/trivy:latest \
            image --severity HIGH,CRITICAL --format table \
            -o /out/trivy-image.txt bkimminich/juice-shop

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: reports/
